<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ronzer AI</title>
<style>
:root {
  --bg:#f9fafb;--panel:#ffffff;--sidebar:#f3f4f6;--text:#1f2937;
  --muted:#6b7280;--accent1:#2563eb;--accent2:#7c3aed;--accent3:#06b6d4;
  --glow:0 0 15px rgba(37,99,235,.3);
}
[data-theme="dark"] {
  --bg:#0b0e1a;--panel:#101425;--sidebar:#0d1120;--text:#e8ecff;
  --muted:#9da7c4;--accent1:#5b8cff;--accent2:#a855f7;--accent3:#00d4ff;
  --glow:0 0 20px rgba(91,140,255,.5);
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body {
  height:100%;width:100%;font-family:"Inter","Segoe UI",sans-serif;
  background:var(--bg);color:var(--text);transition:.5s;
  overflow:hidden;
}
.app{display:grid;grid-template-columns:260px 1fr;height:100vh;overflow:hidden;}
.sidebar{
  background:var(--sidebar);border-right:1px solid rgba(0,0,0,.05);
  display:flex;flex-direction:column;padding:16px;gap:16px;z-index:3;
  transition:.5s;box-shadow:inset 0 0 25px rgba(0,0,0,.05);
}
.sidebar.hide{transform:translateX(-100%);}
.menu-btn{display:none;position:absolute;left:10px;font-size:22px;cursor:pointer;}
.brand{display:flex;align-items:center;gap:10px;animation:glowPulse 4s ease-in-out infinite;}
.brand img{width:36px;height:36px;border-radius:8px;box-shadow:var(--glow);}
.brand h1{font-size:18px;font-weight:700;
  background:linear-gradient(90deg,var(--accent1),var(--accent2),var(--accent3));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.new-chat{
  background:linear-gradient(90deg,var(--accent1),var(--accent2));
  border:none;color:#fff;font-weight:600;border-radius:10px;padding:10px;
  cursor:pointer;box-shadow:var(--glow);transition:.3s;
}
.new-chat:hover{filter:brightness(1.2);}
.model-select{
  background:var(--panel);color:var(--text);
  border:1px solid rgba(0,0,0,.1);
  padding:8px 10px;border-radius:8px;font-size:14px;transition:.3s;
}
.conversations{flex:1;overflow:auto;}
.conv{padding:8px;border-radius:8px;cursor:pointer;font-size:14px;color:var(--muted);margin-bottom:4px;}
.conv.active,.conv:hover{background:rgba(0,0,0,.05);color:var(--text);}
.sidebar-footer{margin-top:auto;font-size:12px;color:var(--muted);text-align:center;}
.main{display:flex;flex-direction:column;position:relative;background:var(--panel);overflow:hidden;}
.header{
  padding:14px 18px;border-bottom:1px solid rgba(0,0,0,.05);
  display:flex;justify-content:space-between;align-items:center;position:relative;
}
.header h2{font-size:18px;font-weight:600;background:linear-gradient(90deg,var(--accent1),var(--accent2));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.controls{display:flex;gap:10px;align-items:center;}
.icon-btn{
  background:none;border:none;font-size:18px;cursor:pointer;color:var(--text);transition:.3s;
}
.icon-btn:hover{color:var(--accent1);}
.chat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;}
.bubble{
  max-width:80%;padding:10px 14px;border-radius:12px;line-height:1.4;font-size:15px;animation:fadeIn .5s;
}
.bubble.user{align-self:flex-end;background:linear-gradient(90deg,var(--accent1),var(--accent2));color:#fff;}
.bubble.ai{align-self:flex-start;background:rgba(255,255,255,.8);}
[data-theme="dark"] .bubble.ai{background:rgba(255,255,255,.1);color:#e8ecff;}
.typing{font-size:20px;animation:blink 1s infinite;letter-spacing:3px;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:.3;}}
.composer{
  display:flex;align-items:center;gap:10px;padding:14px;
  border-top:1px solid rgba(0,0,0,.05);
}
textarea{
  flex:1;resize:none;height:48px;border:none;border-radius:24px;
  padding:12px 48px 12px 16px;font-size:15px;
  background:rgba(255,255,255,.9);
}
.send-btn,.mic-btn{
  width:40px;height:40px;border-radius:50%;border:none;color:#fff;
  background:linear-gradient(135deg,var(--accent1),var(--accent3));
  cursor:pointer;box-shadow:var(--glow);transition:.3s;
}
.send-btn:hover,.mic-btn:hover{transform:scale(1.1);}
.footer{text-align:center;font-size:12px;color:var(--muted);padding:6px;}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
@media(max-width:900px){
  .app{grid-template-columns:1fr;}
  .sidebar{position:absolute;top:0;left:0;height:100%;width:220px;transform:translateX(-100%);}
  .sidebar.show{transform:translateX(0);}
  .menu-btn{display:block;}
}
@keyframes glowPulse{0%,100%{box-shadow:0 0 10px rgba(37,99,235,.4);}50%{box-shadow:0 0 22px rgba(124,58,237,.6);}}
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><img src="ronzer_logo.jpg" alt="Ronzer"><h1>Ronzer AI</h1></div>
    <button class="new-chat" id="newChat">＋ New Chat</button>
    <select class="model-select" id="modelSelect">
      <option value="g2">Ronzer G2 (Gemini)</option>
      <option value="r2">Ronzer R2 (Grok)</option>
    </select>
    <div class="conversations" id="chatList"></div>
    <div class="sidebar-footer">© 2025 RonzDavil</div>
  </aside>
  <main class="main">
    <header class="header">
      <span class="menu-btn" id="menuBtn">☰</span>
      <h2 id="chatTitle">New Chat</h2>
      <div class="controls">
        <button class="icon-btn" id="themeToggle">🌙</button>
        <button class="icon-btn" id="regenBtn">🔁</button>
      </div>
    </header>
    <section class="chat" id="chatWindow"></section>
    <div class="composer">
      <textarea id="userInput" placeholder="Message Ronzer AI…"></textarea>
      <button class="mic-btn" id="micBtn">🎤</button>
      <button class="send-btn" id="sendBtn">➤</button>
    </div>
    <div class="footer">Created by RonzDavil © 2025</div>
  </main>
</div>

<script>
const G2_API_KEY="AIzaSyDA7DtBJlxx-kz3V4WVEkdCpccGEo1mQkA";
const R2_API_KEY="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";
let currentModel="g2", currentChat=[], chatHistory=JSON.parse(localStorage.getItem("ronzerChats")||"[]");
const chatWindow=document.getElementById("chatWindow");
const chatList=document.getElementById("chatList");
const chatTitle=document.getElementById("chatTitle");
const userInput=document.getElementById("userInput");
const sendBtn=document.getElementById("sendBtn");
const regenBtn=document.getElementById("regenBtn");
const micBtn=document.getElementById("micBtn");
const themeToggle=document.getElementById("themeToggle");
const sidebar=document.getElementById("sidebar");
const menuBtn=document.getElementById("menuBtn");
const modelSelect=document.getElementById("modelSelect");
const synth=window.speechSynthesis;

function saveChats(){localStorage.setItem("ronzerChats",JSON.stringify(chatHistory));renderChatList();}
function addMessage(role,content){currentChat.push({role,content});renderMessages();}
function renderMessages(){
  chatWindow.innerHTML="";
  currentChat.forEach(m=>{
    const div=document.createElement("div");
    div.className="bubble "+(m.role==="user"?"user":"ai");
    div.textContent=m.content;
    chatWindow.appendChild(div);
  });
  chatWindow.scrollTop=chatWindow.scrollHeight;
}
function renderChatList(){
  chatList.innerHTML="";
  chatHistory.forEach((c,i)=>{
    const div=document.createElement("div");
    div.className="conv"+(i===chatHistory.length-1?" active":"");
    div.textContent=c.title||`Chat ${i+1}`;
    div.onclick=()=>{currentChat=c.messages;chatTitle.textContent=c.title;renderMessages();};
    const del=document.createElement("span");
    del.textContent="🗑️";del.style.float="right";del.style.cursor="pointer";
    del.onclick=(e)=>{e.stopPropagation();chatHistory.splice(i,1);saveChats();};
    div.appendChild(del);
    chatList.appendChild(div);
  });
}
async function sendToAI(text){
  addMessage("user",text);
  const typing=document.createElement("div");
  typing.className="bubble ai typing";typing.textContent="...";
  chatWindow.appendChild(typing);
  chatWindow.scrollTop=chatWindow.scrollHeight;

  let reply="";
  if(currentModel==="g2"){
    const res=await fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key="+G2_API_KEY,{
      method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({contents:[{parts:[{text:text}]}]})
    });
    const data=await res.json();
    reply=data.candidates?.[0]?.content?.parts?.[0]?.text||"No response.";
  }else{
    const res=await fetch("https://api.groq.com/openai/v1/chat/completions",{
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "Authorization":"Bearer "+R2_API_KEY
      },
      body:JSON.stringify({
        model:"openai/gpt-oss-20b",
        messages:[{role:"user",content:text}],
        temperature:1,max_tokens:512
      })
    });
    const data=await res.json();
    reply=data.choices?.[0]?.message?.content||"No response.";
  }

  typing.remove();
  await typeText(reply);
  addMessage("ai",reply);
  speak(reply);
  autoNameChat();
  saveChats();
}

function typeText(text){
  return new Promise(resolve=>{
    const div=document.createElement("div");
    div.className="bubble ai";
    chatWindow.appendChild(div);
    let i=0;
    const interval=setInterval(()=>{
      div.textContent=text.slice(0,i++);
      chatWindow.scrollTop=chatWindow.scrollHeight;
      if(i>text.length){clearInterval(interval);resolve();}
    },20);
  });
}

function autoNameChat(){
  if(!chatTitle.textContent||chatTitle.textContent==="New Chat"){
    chatTitle.textContent=currentChat[0]?.content?.slice(0,20)||"Chat";
    chatHistory.push({title:chatTitle.textContent,messages:currentChat});
  }else{
    const existing=chatHistory.find(c=>c.title===chatTitle.textContent);
    if(existing)existing.messages=currentChat;
  }
  saveChats();
}

function speak(text){
  if(!synth)return;
  const utter=new SpeechSynthesisUtterance(text);
  utter.lang="en-US";synth.speak(utter);
}

sendBtn.onclick=()=>{
  const text=userInput.value.trim();
  if(!text)return;
  userInput.value="";
  sendToAI(text);
};
regenBtn.onclick=()=>{
  const last=currentChat.findLast(m=>m.role==="user");
  if(last)sendToAI(last.content);
};
modelSelect.onchange=e=>currentModel=e.target.value;
themeToggle.onclick=()=>{
  const dark=document.documentElement.dataset.theme==="dark";
  document.documentElement.dataset.theme=dark?"":"dark";
  localStorage.setItem("ronzerTheme",dark?"light":"dark");
  themeToggle.textContent=dark?"🌙":"☀️";
};
if(localStorage.getItem("ronzerTheme")==="dark"){
  document.documentElement.dataset.theme="dark";
  themeToggle.textContent="☀️";
}
menuBtn.onclick=()=>sidebar.classList.toggle("show");
document.getElementById("newChat").onclick=()=>{
  currentChat=[];chatTitle.textContent="New Chat";renderMessages();
};
micBtn.onclick=()=>{
  if(!('webkitSpeechRecognition'in window)){alert("Voice not supported");return;}
  const rec=new webkitSpeechRecognition();
  rec.lang="en-US";
  rec.start();
  rec.onresult=e=>{
    const text=e.results[0][0].transcript;
    userInput.value=text;
    sendToAI(text);
  };
};
renderChatList();
</script>
</body>
</html>

themeToggle.onclick=()=>{
  const dark=document.documentElement.dataset.theme==="dark";
  document.documentElement.dataset.theme=dark?"":"dark";
  localStorage.setItem("ronzerTheme",dark?"light":"dark");
  themeToggle.textContent=dark?"🌙":"☀️";
};
if(localStorage.getItem("ronzerTheme")==="dark"){
  document.documentElement.dataset.theme="dark";
  themeToggle.textContent="☀️";
}
menuBtn.onclick=()=>sidebar.classList.toggle("show");
document.getElementById("newChat").onclick=()=>{
  currentChat=[];chatTitle.textContent="New Chat";renderMessages();
};
micBtn.onclick=()=>{
  if(!('webkitSpeechRecognition'in window)){alert("Voice not supported");return;}
  const rec=new webkitSpeechRecognition();
  rec.lang="en-US";
  rec.start();
  rec.onresult=e=>{
    const text=e.results[0][0].transcript;
    userInput.value=text;
    sendToAI(text);
  };
};
renderChatList();
</script>
</body>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ronzer AI</title>
<style>
:root {
  --bg:#f9fafb;--panel:#ffffff;--sidebar:#f3f4f6;--text:#1f2937;
  --muted:#6b7280;--accent1:#2563eb;--accent2:#7c3aed;--accent3:#06b6d4;
  --glow:0 0 15px rgba(37,99,235,.3);
}
[data-theme="dark"] {
  --bg:#0b0e1a;--panel:#101425;--sidebar:#0d1120;--text:#e8ecff;
  --muted:#9da7c4;--accent1:#5b8cff;--accent2:#a855f7;--accent3:#00d4ff;
  --glow:0 0 20px rgba(91,140,255,.5);
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body {
  height:100%;width:100%;font-family:"Inter","Segoe UI",sans-serif;
  background:var(--bg);color:var(--text);transition:.5s;
  overflow:hidden;
}
.app{display:grid;grid-template-columns:260px 1fr;height:100vh;overflow:hidden;}
.sidebar{
  background:var(--sidebar);border-right:1px solid rgba(0,0,0,.05);
  display:flex;flex-direction:column;padding:16px;gap:16px;z-index:3;
  transition:.5s;box-shadow:inset 0 0 25px rgba(0,0,0,.05);
}
.sidebar.hide{transform:translateX(-100%);}
.menu-btn{display:none;position:absolute;left:10px;font-size:22px;cursor:pointer;}
.brand{display:flex;align-items:center;gap:10px;animation:glowPulse 4s ease-in-out infinite;}
.brand img{width:36px;height:36px;border-radius:8px;box-shadow:var(--glow);}
.brand h1{font-size:18px;font-weight:700;
  background:linear-gradient(90deg,var(--accent1),var(--accent2),var(--accent3));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.new-chat{
  background:linear-gradient(90deg,var(--accent1),var(--accent2));
  border:none;color:#fff;font-weight:600;border-radius:10px;padding:10px;
  cursor:pointer;box-shadow:var(--glow);transition:.3s;
}
.new-chat:hover{filter:brightness(1.2);}
.model-select{
  background:var(--panel);color:var(--text);
  border:1px solid rgba(0,0,0,.1);
  padding:8px 10px;border-radius:8px;font-size:14px;transition:.3s;
}
.conversations{flex:1;overflow:auto;}
.conv{padding:8px;border-radius:8px;cursor:pointer;font-size:14px;color:var(--muted);margin-bottom:4px;}
.conv.active,.conv:hover{background:rgba(0,0,0,.05);color:var(--text);}
.sidebar-footer{margin-top:auto;font-size:12px;color:var(--muted);text-align:center;}
.main{display:flex;flex-direction:column;position:relative;background:var(--panel);overflow:hidden;}
.header{
  padding:14px 18px;border-bottom:1px solid rgba(0,0,0,.05);
  display:flex;justify-content:space-between;align-items:center;position:relative;
}
.header h2{font-size:18px;font-weight:600;background:linear-gradient(90deg,var(--accent1),var(--accent2));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.controls{display:flex;gap:10px;align-items:center;}
.icon-btn{
  background:none;border:none;font-size:18px;cursor:pointer;color:var(--text);transition:.3s;
}
.icon-btn:hover{color:var(--accent1);}
.chat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;}
.bubble{
  max-width:80%;padding:10px 14px;border-radius:12px;line-height:1.4;font-size:15px;animation:fadeIn .5s;
}
.bubble.user{align-self:flex-end;background:linear-gradient(90deg,var(--accent1),var(--accent2));color:#fff;}
.bubble.ai{align-self:flex-start;background:rgba(255,255,255,.8);}
[data-theme="dark"] .bubble.ai{background:rgba(255,255,255,.1);color:#e8ecff;}
.typing{font-size:20px;animation:blink 1s infinite;letter-spacing:3px;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:.3;}}
.composer{
  display:flex;align-items:center;gap:10px;padding:14px;
  border-top:1px solid rgba(0,0,0,.05);
}
textarea{
  flex:1;resize:none;height:48px;border:none;border-radius:24px;
  padding:12px 48px 12px 16px;font-size:15px;
  background:rgba(255,255,255,.9);
}
.send-btn,.mic-btn{
  width:40px;height:40px;border-radius:50%;border:none;color:#fff;
  background:linear-gradient(135deg,var(--accent1),var(--accent3));
  cursor:pointer;box-shadow:var(--glow);transition:.3s;
}
.send-btn:hover,.mic-btn:hover{transform:scale(1.1);}
.footer{text-align:center;font-size:12px;color:var(--muted);padding:6px;}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
@media(max-width:900px){
  .app{grid-template-columns:1fr;}
  .sidebar{position:absolute;top:0;left:0;height:100%;width:220px;transform:translateX(-100%);}
  .sidebar.show{transform:translateX(0);}
  .menu-btn{display:block;}
}
@keyframes glowPulse{0%,100%{box-shadow:0 0 10px rgba(37,99,235,.4);}50%{box-shadow:0 0 22px rgba(124,58,237,.6);}}
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><img src="ronzer_logo.jpg" alt="Ronzer"><h1>Ronzer AI</h1></div>
    <button class="new-chat" id="newChat">＋ New Chat</button>
    <select class="model-select" id="modelSelect">
      <option value="g2">Ronzer G2 (Gemini)</option>
      <option value="r2">Ronzer R2 (Grok)</option>
    </select>
    <div class="conversations" id="chatList"></div>
    <div class="sidebar-footer">© 2025 RonzDavil</div>
  </aside>
  <main class="main">
    <header class="header">
      <span class="menu-btn" id="menuBtn">☰</span>
      <h2 id="chatTitle">New Chat</h2>
      <div class="controls">
        <button class="icon-btn" id="themeToggle">🌙</button>
        <button class="icon-btn" id="regenBtn">🔁</button>
      </div>
    </header>
    <section class="chat" id="chatWindow"></section>
    <div class="composer">
      <textarea id="userInput" placeholder="Message Ronzer AI…"></textarea>
      <button class="mic-btn" id="micBtn">🎤</button>
      <button class="send-btn" id="sendBtn">➤</button>
    </div>
    <div class="footer">Created by RonzDavil © 2025</div>
  </main>
</div>

<script>
const G2_API_KEY="YOUR_G2_KEY";
const R2_API_KEY="YOUR_R2_KEY";
let currentModel="g2", currentChat=[], chatHistory=JSON.parse(localStorage.getItem("ronzerChats")||"[]");
const chatWindow=document.getElementById("chatWindow");
const chatList=document.getElementById("chatList");
const chatTitle=document.getElementById("chatTitle");
const userInput=document.getElementById("userInput");
const sendBtn=document.getElementById("sendBtn");
const regenBtn=document.getElementById("regenBtn");
const micBtn=document.getElementById("micBtn");
const themeToggle=document.getElementById("themeToggle");
const sidebar=document.getElementById("sidebar");
const menuBtn=document.getElementById("menuBtn");
const modelSelect=document.getElementById("modelSelect");
const synth=window.speechSynthesis;

function saveChats(){localStorage.setItem("ronzerChats",JSON.stringify(chatHistory));renderChatList();}
function addMessage(role,content){currentChat.push({role,content});renderMessages();}
function renderMessages(){
  chatWindow.innerHTML="";
  currentChat.forEach(m=>{
    const div=document.createElement("div");
    div.className="bubble "+(m.role==="user"?"user":"ai");
    div.textContent=m.content;
    chatWindow.appendChild(div);
  });
  chatWindow.scrollTop=chatWindow.scrollHeight;
}
function renderChatList(){
  chatList.innerHTML="";
  chatHistory.forEach((c,i)=>{
    const div=document.createElement("div");
    div.className="conv"+(i===chatHistory.length-1?" active":"");
    div.textContent=c.title||`Chat ${i+1}`;
    div.onclick=()=>{currentChat=c.messages;chatTitle.textContent=c.title;renderMessages();};
    const del=document.createElement("span");
    del.textContent="🗑️";del.style.float="right";del.style.cursor="pointer";
    del.onclick=(e)=>{e.stopPropagation();chatHistory.splice(i,1);saveChats();};
    div.appendChild(del);
    chatList.appendChild(div);
  });
}
async function sendToAI(text){
  addMessage("user",text);
  const typing=document.createElement("div");
  typing.className="bubble ai typing";typing.textContent="...";
  chatWindow.appendChild(typing);
  chatWindow.scrollTop=chatWindow.scrollHeight;

  let reply="";
  if(currentModel==="g2"){
    const res=await fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key="+G2_API_KEY,{
      method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({contents:[{parts:[{text:text}]}]})
    });
    const data=await res.json();
    reply=data.candidates?.[0]?.content?.parts?.[0]?.text||"No response.";
  }else{
    const res=await fetch("https://api.groq.com/openai/v1/chat/completions",{
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "Authorization":"Bearer "+R2_API_KEY
      },
      body:JSON.stringify({
        model:"openai/gpt-oss-20b",
        messages:[{role:"user",content:text}],
        temperature:1,max_tokens:512
      })
    });
    const data=await res.json();
    reply=data.choices?.[0]?.message?.content||"No response.";
  }

  typing.remove();
  await typeText(reply);
  addMessage("ai",reply);
  speak(reply);
  autoNameChat();
  saveChats();
}

function typeText(text){
  return new Promise(resolve=>{
    const div=document.createElement("div");
    div.className="bubble ai";
    chatWindow.appendChild(div);
    let i=0;
    const interval=setInterval(()=>{
      div.textContent=text.slice(0,i++);
      chatWindow.scrollTop=chatWindow.scrollHeight;
      if(i>text.length){clearInterval(interval);resolve();}
    },20);
  });
}

function autoNameChat(){
  if(!chatTitle.textContent||chatTitle.textContent==="New Chat"){
    chatTitle.textContent=currentChat[0]?.content?.slice(0,20)||"Chat";
    chatHistory.push({title:chatTitle.textContent,messages:currentChat});
  }else{
    const existing=chatHistory.find(c=>c.title===chatTitle.textContent);
    if(existing)existing.messages=currentChat;
  }
  saveChats();
}

function speak(text){
  if(!synth)return;
  const utter=new SpeechSynthesisUtterance(text);
  utter.lang="en-US";synth.speak(utter);
}

sendBtn.onclick=()=>{
  const text=userInput.value.trim();
  if(!text)return;
  userInput.value="";
  sendToAI(text);
};
regenBtn.onclick=()=>{
  const last=currentChat.findLast(m=>m.role==="user");
  if(last)sendToAI(last.content);
};
modelSelect.onchange=e=>currentModel=e.target.value;
themeToggle.onclick=()=>{
  const dark=document.documentElement.dataset.theme==="dark";
  document.documentElement.dataset.theme=dark?"":"dark";
  localStorage.setItem("ronzerTheme",dark?"light":"dark");
  themeToggle.textContent=dark?"🌙":"☀️";
};
if(localStorage.getItem("ronzerTheme")==="dark"){
  document.documentElement.dataset.theme="dark";
  themeToggle.textContent="☀️";
}
menuBtn.onclick=()=>sidebar.classList.toggle("show");
document.getElementById("newChat").onclick=()=>{
  currentChat=[];chatTitle.textContent="New Chat";renderMessages();
};
micBtn.onclick=()=>{
  if(!('webkitSpeechRecognition'in window)){alert("Voice not supported");return;}
  const rec=new webkitSpeechRecognition();
  rec.lang="en-US";
  rec.start();
  rec.onresult=e=>{
    const text=e.results[0][0].transcript;
    userInput.value=text;
    sendToAI(text);
  };
};
renderChatList();
</script>
</body>
</html>
